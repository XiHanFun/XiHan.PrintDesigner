name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# 同一分支连续推送时只保留最新一轮；main 上每个提交都跑完整结论
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: print

jobs:
  quality:
    name: Lint、构建、类型与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 仓库根没有 package.json，pnpm 版本以工作区清单为准
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: print/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: print/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

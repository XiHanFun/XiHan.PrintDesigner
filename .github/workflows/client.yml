name: Client

on:
  push:
    branches: [dev, main]
    paths: ['client/**', '.github/workflows/client.yml']
  pull_request:
    branches: [dev, main]
    paths: ['client/**', '.github/workflows/client.yml']

# 同一分支连续推送时只保留最新一轮；main 上每个提交都跑完整结论
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: client

jobs:
  build:
    name: 构建与测试
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # SDK 版本以 client/global.json 为准
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: client/global.json
      - run: dotnet restore XiHan.PrintClient.slnx
      - name: Build
        run: dotnet build XiHan.PrintClient.slnx -c Release --no-restore
      # 原始通道的集成测试：装一台通用文本打印机，端口指向文件，测试核对写出的字节
      - name: Install test printer
        shell: pwsh
        run: |
          if ((Get-Service Spooler).Status -ne 'Running') {
            Set-Service Spooler -StartupType Manual
            Start-Service Spooler
          }
          $output = Join-Path $env:RUNNER_TEMP 'xihan-print-raw.prn'
          Add-PrinterDriver -Name 'Generic / Text Only'
          Add-PrinterPort -Name $output
          Add-Printer -Name 'XiHan Print Test' -DriverName 'Generic / Text Only' -PortName $output
          "XIHAN_PRINT_TEST_PRINTER=XiHan Print Test" >> $env:GITHUB_ENV
          "XIHAN_PRINT_TEST_OUTPUT=$output" >> $env:GITHUB_ENV
      # dotnet test 由 global.json 的 test.runner 驱动 Microsoft.Testing.Platform
      - name: Test
        run: dotnet test --solution XiHan.PrintClient.slnx -c Release --no-build

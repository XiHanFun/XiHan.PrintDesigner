name: Client

on:
  push:
    branches: [dev, preview, main]
    paths: ['client/**', '.github/workflows/client.yml']
  pull_request:
    branches: [dev, preview, main]
    paths: ['client/**', '.github/workflows/client.yml']

# 同一分支连续推送时只保留最新一轮；main 与 preview 上每个提交都跑完整结论
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/preview' }}

defaults:
  run:
    working-directory: client

jobs:
  build:
    name: 构建与测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Linux 依赖（WebKitGTK、CUPS、虚拟显示）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libcups2-dev cups printer-driver-cups-pdf xvfb fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - name: 窗口界面
        run: |
          pnpm typecheck
          pnpm build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 原始通道与打印的集成测试：Windows 装一台通用文本打印机，端口指向文件
      - name: 测试打印机（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-Service Spooler).Status -ne 'Running') {
            Set-Service Spooler -StartupType Manual
            Start-Service Spooler
          }
          $output = Join-Path $env:RUNNER_TEMP 'xihan-print-raw.prn'
          Add-PrinterDriver -Name 'Generic / Text Only'
          Add-PrinterPort -Name $output
          Add-Printer -Name 'XiHan Print Test' -DriverName 'Generic / Text Only' -PortName $output
          "XIHAN_PRINT_TEST_PRINTER=XiHan Print Test" >> $env:GITHUB_ENV
          "XIHAN_PRINT_TEST_OUTPUT=$output" >> $env:GITHUB_ENV
      # Linux 起 cupsd：HTML 通道用一台写文件的通用 PostScript 打印机；原始指令用一台指向本机端口的打印机，由测试自己在端口上收
      - name: 测试打印机（Linux）
        if: runner.os == 'Linux'
        run: |
          echo 'FileDevice Yes' | sudo tee -a /etc/cups/cups-files.conf
          sudo systemctl restart cups
          output="$RUNNER_TEMP/xihan-print-test.out"
          sudo touch "$output" && sudo chmod 666 "$output"
          sudo lpadmin -p XiHanPrintTest -E -v "file:$output" -m drv:///sample.drv/generic.ppd
          sudo lpadmin -p XiHanPrintRaw -E -v socket://127.0.0.1:9101 -m raw
          echo "XIHAN_PRINT_TEST_PRINTER=XiHanPrintTest" >> "$GITHUB_ENV"
          echo "XIHAN_PRINT_TEST_OUTPUT=$output" >> "$GITHUB_ENV"
          echo "XIHAN_PRINT_TEST_RAW_PRINTER=XiHanPrintRaw" >> "$GITHUB_ENV"
          echo "XIHAN_PRINT_TEST_RAW_LISTEN=127.0.0.1:9101" >> "$GITHUB_ENV"
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      - name: Test（虚拟显示）
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- cargo test --workspace --locked

  package-windows:
    name: 安装包（Windows）
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      # 分支构建不签名；签名与发布走 client-release.yml
      - name: Package
        shell: pwsh
        run: ./installer/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: xihan-print-client-windows
          path: |
            client/installer/output/*.exe
            client/installer/output/*.sha256
          if-no-files-found: error

  package-unix:
    name: 安装包（${{ matrix.name }}）
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: 按发布的写法改名
        run: node scripts/collect-bundles.mjs --target ${{ matrix.target }} --out bundles
      - uses: actions/upload-artifact@v7
        with:
          name: xihan-print-client-${{ matrix.target }}
          path: client/bundles/*
          if-no-files-found: error

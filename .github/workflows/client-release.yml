name: Client Release

# 由 release.yml 在 v<版本> 标签上调用，与发 npm 并行：编译 Windows、macOS、Linux 三个平台的打印客户端安装包（Windows 有证书时签名），
# Windows 每个架构出在线安装包与自带 WebView2 固定版运行时的离线安装包（运行时的版本与下载地址钉在 client/installer/webview2-fixed.json）；
# 建这个标签的草稿 Release：说明取文档站更新日志的这一版，附件是安装包、SHA-256 与 update.json。
# 标签核对在 release.yml 的「核对标签」里做；发布草稿、把 update.json 提交到 main 由维护者手动完成。
on:
  workflow_call:

jobs:
  version:
    name: 核对客户端版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        working-directory: client
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 client/Cargo.toml 的版本 $version 不一致" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows 安装包
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SIGNING_CERT: ${{ secrets.CLIENT_SIGNING_CERT }}
      SIGNING_PASSWORD: ${{ secrets.CLIENT_SIGNING_PASSWORD }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --locked
      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      # 离线安装包用的 WebView2 固定版运行时：按 webview2-fixed.json 下载两个架构的 .cab，解开与核对微软签名在 build.ps1 里做
      - name: Download WebView2 Fixed Version Runtime
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $fixed = Get-Content installer/webview2-fixed.json -Raw | ConvertFrom-Json
          $directory = Join-Path $env:RUNNER_TEMP 'webview2-fixed'
          New-Item -ItemType Directory -Force $directory | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            $url = $fixed.$arch
            if ($url -notmatch "^https://[^/]+\.microsoft\.com/.+/Microsoft\.WebView2\.FixedVersionRuntime\.$([regex]::Escape($fixed.version))\.$arch\.cab$") {
              throw "webview2-fixed.json 里 $arch 的地址与版本 $($fixed.version) 对不上：$url"
            }
            Write-Host "下载 WebView2 固定版运行时 $($fixed.version) $arch"
            Invoke-WebRequest -Uri $url -OutFile (Join-Path $directory "$arch.cab")
          }
      # 仓库密钥里有证书时才签名；没有时照常出未签名的安装包，客户端的自动更新不会安装它
      - name: Prepare signing
        if: env.SIGNING_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'client-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGN_COMMAND=`"$($signtool.FullName)`" sign /f `"$pfx`" /p $env:SIGNING_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        run: |
          $fixed = Join-Path $env:RUNNER_TEMP 'webview2-fixed'
          ./installer/build.ps1 -SignCommand "$env:SIGN_COMMAND" -WebView2FixedRuntime @{ x64 = (Join-Path $fixed 'x64.cab'); arm64 = (Join-Path $fixed 'arm64.cab') }
      - uses: actions/upload-artifact@v7
        with:
          name: client-windows
          path: |
            client/installer/output/*.exe
            client/installer/output/*.sha256
          if-no-files-found: error
      - name: Remove signing certificate
        if: always() && env.SIGNING_CERT != ''
        shell: pwsh
        run: Remove-Item -Force (Join-Path $env:RUNNER_TEMP 'client-signing.pfx') -ErrorAction SilentlyContinue

  unix:
    name: ${{ matrix.name }} 安装包
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: 按发布的写法改名
        run: node scripts/collect-bundles.mjs --target ${{ matrix.target }} --out bundles
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.target }}
          path: client/bundles/*
          if-no-files-found: error

  release:
    name: 草稿 Release
    needs: [version, windows, unix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CLIENT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: client-*
          path: assets
          merge-multiple: true
      - name: 按更新日志写 Release 说明
        working-directory: print
        run: node scripts/release/release-notes.mjs --version "$CLIENT_VERSION" --out "$RUNNER_TEMP/release-notes.md"
      - name: 更新清单
        run: node client/scripts/update-manifest.mjs --version "$CLIENT_VERSION" --base-url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/release-notes.md" --out assets/update.json assets/*
      # 重跑时这个标签的草稿已经在：把附件覆盖上去、说明换成最新的，不另建
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            prerelease=()
            case "$CLIENT_VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --draft "${prerelease[@]}" --title "$GITHUB_REF_NAME" --notes-file "$notes" assets/*
          fi

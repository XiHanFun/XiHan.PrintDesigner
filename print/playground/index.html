<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打印设计器 · 开发预览</title>
  <style>
    body { margin: 0; background: var(--xh-bg-page); color: var(--xh-fg-default); }
    .page { display: grid; gap: var(--xh-space-4); max-inline-size: 80rem; margin-inline: auto; padding: var(--xh-space-4); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-3); }
    .switch-label { display: inline-flex; align-items: center; gap: var(--xh-space-2); color: var(--xh-fg-muted); font-size: var(--xh-font-size-sm); }
    .status { margin: 0; color: var(--xh-fg-muted); font-size: var(--xh-font-size-sm); }
    xh-print-preview { block-size: 48rem; border: var(--xh-stroke-thin) solid var(--xh-border-default); border-radius: var(--xh-radius-md); }
  </style>
</head>
<body>
  <main class="page">
    <xh-alert tone="warning">
      <div data-xh-part="root">
        <div data-xh-part="content">
          <div data-xh-part="title">这是开发预览，不是产品</div>
          <div data-xh-part="description">只用来查看打印运行时的分页与渲染效果。模板与数据都是写死的示例，界面与接口都还会变。</div>
        </div>
      </div>
    </xh-alert>

    <div class="bar">
      <xh-toggle-group id="samples" default-value="delivery" disallow-empty>
        <div data-xh-part="root" aria-label="示例模板">
          <button data-xh-part="item" type="button" value="delivery">送货单</button>
          <button data-xh-part="item" type="button" value="label">商品标签</button>
          <button data-xh-part="item" type="button" value="notice">内部通知</button>
        </div>
      </xh-toggle-group>
      <xh-toolbar>
        <div data-xh-part="root" aria-label="预览操作">
          <div data-xh-part="group">
            <button data-xh-part="item" type="button" value="zoom-out">缩小</button>
            <button data-xh-part="item" type="button" value="actual">100%</button>
            <button data-xh-part="item" type="button" value="zoom-in">放大</button>
          </div>
          <div data-xh-part="separator"></div>
          <div data-xh-part="group">
            <button data-xh-part="item" type="button" value="print">浏览器打印</button>
          </div>
        </div>
      </xh-toolbar>
      <span class="switch-label">
        <xh-switch id="zh">
          <button data-xh-part="root" aria-label="中文语言包">
            <span data-xh-part="thumb"></span>
          </button>
        </xh-switch>
        中文语言包 printZhCN
      </span>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
    <xh-print-preview id="preview"></xh-print-preview>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

minimumReleaseAgeExcludePrune: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - 'packages/*'
  - playground

allowBuilds:
  esbuild: true

# 依赖目录（单一版本事实源）。包内一律用 catalog: 引用，升级只改这里一处
catalog:
  # @xihan-ui：三个包的 devDependencies 用这里的版本；peerDependencies 另写同一范围（宿主装唯一的一份），升级时两处一起改
  '@xihan-ui/core': ^5.0.0
  '@xihan-ui/designer-kit': ^5.0.0
  '@xihan-ui/designer-shell': ^5.0.0
  '@xihan-ui/expression': ^5.0.0
  '@xihan-ui/headless': ^5.0.0
  '@xihan-ui/icons': ^5.0.0
  '@xihan-ui/pointer': ^5.0.0
  '@xihan-ui/styles': ^5.0.0
  '@xihan-ui/viz': ^5.0.0
  '@xihan-ui/web-components': ^5.0.0
  # 开发依赖
  '@antfu/eslint-config': ^9.5.1
  '@arethetypeswrong/cli': ^0.18.0
  '@changesets/cli': ^2.31.0
  '@types/node': ^24.10.0
  eslint: ^10.12.0
  jsdom: ^27.0.0
  oxlint: ^1.88.0
  publint: ^0.3.25
  tsdown: ~0.22.0
  typescript: ^6.0.3
  vite: ^8.3.4
  vitest: ^4.1.11

minimumReleaseAgeExclude:
  - '@xihan-ui/core@5.0.0'
  - '@xihan-ui/designer-kit@5.0.0'
  - '@xihan-ui/designer-shell@5.0.0'
  - '@xihan-ui/expression@5.0.0'
  - '@xihan-ui/headless@5.0.0'
  - '@xihan-ui/icons@5.0.0'
  - '@xihan-ui/motion@5.0.0'
  - '@xihan-ui/pointer@5.0.0'
  - '@xihan-ui/position@5.0.0'
  - '@xihan-ui/styles@5.0.0'
  - '@xihan-ui/tokens@5.0.0'
  - '@xihan-ui/viz@5.0.0'
  - '@xihan-ui/web-components@5.0.0'

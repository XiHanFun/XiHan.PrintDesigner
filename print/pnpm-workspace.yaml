minimumReleaseAgeExcludePrune: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - 'packages/*'

allowBuilds:
  esbuild: true

# 依赖目录（单一版本事实源）。包内一律用 catalog: 引用，升级只改这里一处
catalog:
  # 运行时依赖
  '@xihan-ui/core': ^5.0.0
  '@xihan-ui/designer-kit': ^5.0.0
  '@xihan-ui/expression': ^5.0.0
  '@xihan-ui/headless': ^5.0.0
  # 开发依赖
  '@antfu/eslint-config': ^9.5.1
  '@types/node': ^24.10.0
  eslint: ^10.12.0
  oxlint: ^1.88.0
  tsdown: ~0.22.0
  typescript: ^6.0.3
  vitest: ^4.1.11

# 开发期临时：@xihan-ui/* 改指同级 XiHan.UI 源码（与 BasicApp 联调方式相同）。
# UI 5.0.0 正式发布后删掉本段，即回落到 catalog 里的发布版。
overrides:
  '@xihan-ui/core': 'link:../../XiHan.UI/ui/packages/engine/core'
  '@xihan-ui/designer-kit': 'link:../../XiHan.UI/ui/packages/features/designer-kit'
  '@xihan-ui/expression': 'link:../../XiHan.UI/ui/packages/features/expression'
  '@xihan-ui/headless': 'link:../../XiHan.UI/ui/packages/engine/headless'
